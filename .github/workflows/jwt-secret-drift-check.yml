name: JWT Secret Drift Check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - 'ops/cloudfront/**'
      - '.github/workflows/jwt-secret-drift-check.yml'

concurrency:
  group: jwt-drift-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, windows, ec2, 3i-portal]

    steps:
      - name: Pull latest code
        shell: powershell
        run: |
          Set-Location "C:\portal\3i-Portal"
          git fetch origin master
          git reset --hard origin/master

      - name: Check JWT secret alignment (SSM vs backend vs edge functions)
        shell: powershell
        run: |
          & "C:\portal\3i-Portal\ops\cloudfront\sync-edge-jwt.ps1" -Mode Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
