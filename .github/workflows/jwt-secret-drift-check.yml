name: JWT Secret Drift Check

on:
  # Scheduled runs are intentionally DISABLED until the one-time setup is done, or
  # the check fails every run (it can't read the canonical secret) and emails a
  # failure. To re-enable the recurring gate AFTER setup, restore:
  #   schedule:
  #     - cron: '0 */6 * * *'
  # Setup = create SSM SecureString /3i-portal/jwt-secret (seed with backend .env
  # JWT_SECRET) + grant the runner role ssm:GetParameter + kms:Decrypt +
  # cloudfront:GetFunction (see ops/cloudfront/README.md). Runs on demand meanwhile.
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - 'ops/cloudfront/**'

concurrency:
  group: jwt-drift-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, windows, ec2, 3i-portal]

    steps:
      - name: Pull latest code
        shell: powershell
        run: |
          Set-Location "C:\portal\3i-Portal"
          git fetch origin master
          git reset --hard origin/master

      - name: Check JWT secret alignment (SSM vs backend vs edge functions)
        shell: powershell
        run: |
          & "C:\portal\3i-Portal\ops\cloudfront\sync-edge-jwt.ps1" -Mode Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
