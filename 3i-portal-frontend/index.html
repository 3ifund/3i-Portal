<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>3i Fund Portal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <img src="assets/logo.png" alt="3i Fund" class="login-logo" id="login-logo">
            <h1 class="login-title"></h1>

            <div class="login-error" id="login-error"></div>

            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label class="form-label" for="user-id">User ID</label>
                    <input
                        type="text"
                        id="user-id"
                        class="form-input"
                        placeholder="Enter your User ID"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="login-btn">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <script>var _v = Date.now();</script>
    <script>document.write('<script src="js/config.js?v=' + _v + '"><\/script>');</script>
    <script>document.write('<script src="js/api.js?v=' + _v + '"><\/script>');</script>
    <script>document.write('<script src="js/auth.js?v=' + _v + '"><\/script>');</script>
</body>
</html>
